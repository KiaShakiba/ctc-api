[package]
name = "ctc-api"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
tokio = { version = "1", features = ["full"] }
dotenvy = "0.15.7"
serde = { version = "1.0.229", features = ["derive"] }
axum = { version = "0.8.9", features = ["multipart", "macros", "ws"] }
diesel = { version = "2.3.11", features = ["postgres", "r2d2", "chrono"] }
diesel-async = { version = "0.9.2", features = ["postgres", "deadpool"] }
deadpool-diesel = { version = "0.6.1", features = ["postgres"] }
tower-http = { version = "0.7.0", features = ["cors", "compression-gzip"] }
regex = "1.13.1"
chrono = { version = "0.4.45", features = ["serde"] }
axum-valid = "0.25.0"
validator = { version = "0.20.0", features = ["derive"] }
paper-client = "1.11.0"
argon2 = "0.5.3"
once_cell = "1.21.4"
postcard = { version = "1.1.3", features = ["alloc"] }
rand = "0.10.2"
primal-sieve = "0.3.7"
num-traits = "0.2.19"
kwik = "1.19.7"
diesel_migrations = "2.3.2"
mimalloc = "0.1.52"
tracing = "0.1"
tracing-subscriber = "0.3"
